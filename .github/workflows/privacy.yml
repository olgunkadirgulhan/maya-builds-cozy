name: privacy
# Videoları gizli/liste dışı yapar (tekrar eden içerik temizliği). Silmez.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Video id'leri (boşluk ya da virgülle)
        required: true
      status:
        description: private | unlisted | public
        default: private
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IDS: ${{ inputs.ids }}
          STATUS: ${{ inputs.status }}
        run: python tools/set_privacy.py $IDS --status "$STATUS"
