name: comments
# Yeni videolara videoya özel ilk yorum + yorumlara kişisel cevap (tools/auto_reply.py), saatte bir
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - name: Maya Builds Cozy
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: "Maya Builds Cozy"
          CHANNEL_ABOUT: "Cozy DIY before/after builds from cheap materials."
          CHANNEL_KIND: general
          CHANNEL_LANG: en
          STATE_FILE: comment_replies.json
          REQUESTS_FILE: viewer_requests.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_QUESTIONS: "[\"Would you build this {topic}? 🔨\", \"Which color would you pick for the {topic}? 🎨\", \"Where would you put this at home? 🏡\", \"Before or after: which one wins? ✨\", \"What should Maya build next? 💡\", \"How much do you think this cost? 💸\", \"Would your pet love this too? 🐾\", \"Which step looked the most satisfying? 😌\", \"Rate this {topic} glow-up from 1 to 10 ⭐\", \"Have you ever upcycled something like this? ♻️\", \"Would you add lights or keep it simple? 💡\", \"Weekend project or too much work? 🛠️\", \"What would you change in this build? ✏️\", \"Indoor or garden: where does this fit best? 🌿\", \"What junk at home should Maya transform next? 🗑️\"]"
        run: python tools/auto_reply.py
      - run: |
          git config user.name "comment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comment_replies*.json viewer_requests*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "comments: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
