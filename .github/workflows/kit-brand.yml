name: kit-brand
# Kanal açıklaması + anahtar kelimeler (kit_brand.py), elle çalıştırılır
on:
  workflow_dispatch:
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q Pillow numpy google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          BRAND_DESC: "The evolution of everything! 📱🚗✈️\n\nShort, fact-checked timelines of how everyday things changed: phones, cars, airplanes, computers, cameras, bikes and more. Rounded, commonly cited numbers.\n\nNew evolutions every day — comment what we should evolve next!"
          BRAND_KW: "evolution of,evolution,history of,then and now,technology history,how things changed,timeline,inventions"
        run: python kit_brand.py
