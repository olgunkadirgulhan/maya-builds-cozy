name: kit-brand
# Kanal açıklaması + anahtar kelimeler (kit_brand.py), elle çalıştırılır
on:
  workflow_dispatch:
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q Pillow numpy google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          BRAND_DESC: "Guess the animal by its shadow! 🐾🌅

A new 6-round animal quiz every day, from easy to hard. Pause, guess, and comment your score.

Images: Noto Color Emoji by Google (SIL Open Font License)."
          BRAND_KW: "guess the animal,animal quiz,shadow quiz,animal shadows,animals,quiz,brain test,silhouette quiz"
        run: python kit_brand.py
