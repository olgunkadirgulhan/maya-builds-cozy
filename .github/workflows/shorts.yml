name: shorts
on:
  schedule:
    # 3 videos/day at US viewing times (EDT): slots 16:00, 20:00, 22:00 UTC (12/16/18 ET).
    # DIY did best in the ET afternoon/evening on 09-22..26; the last slot stays before 23:00 UTC
    # so it gets two tries before the UTC day (and the daily count) rolls over.
    # Fired hourly by cron-job.org (auto=true) with this cron as a backup;
    # .github/slot_guard.py makes a video only when a slot is due and not yet uploaded.
    # MAX_PER_DAY in run.py stays the hard cap.
    - cron: "41 16-23 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: Render only, do not upload
        type: boolean
        default: false
      auto:
        description: External scheduler call - follow the slot plan like a scheduled run
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # yükleme sonrası comments.yml'yi tetiklemek için

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          LOG_FILE: published.csv
          # 6 proje var: günde 3 video aynı projeleri 2 günde bir tekrarlıyordu; yeni projeler eklenene kadar günde 1
          SLOTS: "20:00"
        run: python3 .github/slot_guard.py

  make-and-upload:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
        run: python run.py ${{ inputs.no_upload && '--no-upload' || '' }}
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shorts-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/meta.json
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "maya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git add -A queue/ || true
          git add published.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "short: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
      - name: İlk yorum (hemen)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run comments.yml -R ${{ github.repository }} || true
